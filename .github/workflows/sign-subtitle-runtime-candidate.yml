name: Sign subtitle runtime candidate manifest

on:
  workflow_dispatch:
    inputs:
      manifest_base64:
        description: Base64-encoded public Subtitle Runtime 0.1.27 manifest
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of the public manifest
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "cryptography>=44,<51"
      - name: Validate and sign the candidate manifest
        env:
          MANIFEST_BASE64: ${{ inputs.manifest_base64 }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          NOVAFLOW_UPDATE_SIGNING_KEY_PEM: ${{ secrets.NOVAFLOW_UPDATE_SIGNING_KEY_PEM }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import load_pem_private_key, load_pem_public_key

          body = base64.b64decode(os.environ["MANIFEST_BASE64"], validate=True)
          if hashlib.sha256(body).hexdigest() != os.environ["MANIFEST_SHA256"]:
              raise ValueError("candidate manifest digest mismatch")
          manifest = json.loads(body)
          if manifest.get("package_name") != "subtitle-runtime-windows-x64" or manifest.get("version") != "0.1.27":
              raise ValueError("candidate manifest identity mismatch")
          private_text = os.environ.get("NOVAFLOW_UPDATE_SIGNING_KEY_PEM", "").strip()
          if not private_text:
              raise ValueError("GitHub update signing secret is missing")
          private = load_pem_private_key(private_text.replace("\\n", "\n").encode("ascii"), None)
          public = load_pem_public_key(Path("update-public.pem").read_bytes())
          if not isinstance(private, Ed25519PrivateKey):
              raise ValueError("update signing secret is not Ed25519")
          probe = b"novaflow-subtitle-runtime-candidate-key-match"
          public.verify(private.sign(probe), probe)
          output = Path("signed")
          output.mkdir()
          signature = output / "NovaFlow-Subtitle-Runtime-0.1.27-Windows-x64.zip.manifest.json.sig"
          signature.write_text(base64.b64encode(private.sign(body)).decode("ascii") + "\n", encoding="ascii")
          print("signature_sha256=" + hashlib.sha256(signature.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: subtitle-runtime-0.1.27-candidate-signature
          path: signed/*.sig
          if-no-files-found: error
          retention-days: 1
